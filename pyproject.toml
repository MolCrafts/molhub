[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "molhub"
version = "0.1.0"
description = "Molecular dataset hub — map/iter-style dataset protocols, built-in datasets, and uploaders for HuggingFace and Figshare"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
  { name = "Roy Kid" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  # Pinned to a minor range: molpy is pre-1.0 and moves public API between
  # minors (0.3 -> 0.9 relocated Frame/Block/Element and renamed
  # Frame.metadata -> Frame.meta). An open lower bound let that land silently.
  # On dev, [tool.uv.sources] builds it from the sibling checkout instead.
  "molcrafts-molpy>=0.16,<0.17",
  "tqdm",
  "requests>=2.28",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  # Proves the shipped JSON Schema is valid and enforces what it claims;
  # the runtime parser does not depend on it.
  "jsonschema>=4.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.15",
  "ruff>=0.15",
  # ty reads types out of packages that ship no
  # py.typed (molpy does not), which is the only way a checker can see the
  # `Frame.metadata` -> `Frame.meta` class of upstream rename; mypy treats
  # molpy as Any and sees nothing. Gate it (tox lint / lint.yml / pre-commit)
  # CI gates `ty check src/`; keep a lower bound because ty is still 0.0.x and
  # diagnostics can move between releases.
  "ty>=0.0.69",
  "tox>=4.23",
  # Build binding only. molrs is molpy's dependency, not molhub's API -- no
  # molhub module imports molrs (Frame, Block, MetaValue come from molpy). It
  # is named here solely because [tool.uv.sources] path overrides apply to a
  # project's OWN requirements, not to transitive ones: without this line the
  # sibling molpy resolves against the published molrs instead of the sibling
  # molrs checkout.
  "molcrafts-molrs",
]
huggingface = ["huggingface_hub>=0.20"]

[dependency-groups]
docs = [
  "zensical>=0.0.45",
  "molcrafts-zensical-theme>=0.2.9,<0.3",
  "mkdocstrings-python>=1.16",
]

# On dev, molhub is built and tested against its partners' dev, not a release:
# uv builds molpy and molrs from the sibling checkouts ../molpy and ../molrs,
# which CI and the git hooks check out at the commits scripts/partners.py
# resolves (.github/partners.env). uv.lock is committed and universal (every
# platform's markers), so it holds on every architecture the project is
# developed on; lint.yml checks it with `uv lock --check`.
[tool.uv.sources]
molcrafts-molpy = { path = "../molpy", editable = true }
molcrafts-molrs = { path = "../molrs/molrs-python" }

[project.scripts]
molhub = "molhub.cli:app"

[project.urls]
Repository = "https://github.com/MolCrafts/molhub"

# Third-party packages add a hosting platform by publishing a Source driver
# into this group; molhub discovers it with no source change on our side.
[project.entry-points."molhub.sources"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molhub = ["schema/*.yaml", "registry_data/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# PLW1514 (a preview rule; explicit-preview-rules keeps every other preview
# rule off): text-mode I/O names its encoding. Unnamed, Python decodes with
# the locale -- cp1252 on Windows.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "PLW1514"]
ignore = [
  "E402",
  "E741",
  "F403",
  "F405",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ty.environment]
python-version = "3.12"

# `huggingface_hub` lives in the optional `huggingface` extra and is imported
# function-locally so molhub works without it. The lint environment
# deliberately does not install it, so its import is unresolvable there. This
# silences the missing third-party module only — every other rule still
# applies to this file.
[[tool.ty.overrides]]
include = ["src/molhub/sources/drivers/huggingface.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff>=0.15",
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
commands = [
  ["ruff", "check", "src/", "tests/"],
  ["ruff", "format", "--check", "src/", "tests/"],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "--cov=src/molhub", "--cov-report=term-missing", "--cov-report=xml", "-v"],
]
