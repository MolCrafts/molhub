[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "molhub"
version = "0.1.0"
description = "Molecular dataset hub — map/iter-style dataset protocols, built-in datasets, and uploaders for HuggingFace and Figshare"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
  { name = "Roy Kid" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  # molpy is pre-1.0 and moves public API between minors. 0.14 dropped
  # `MolRec`/`Record` (I/O is `molpy.io.mrec`), stores atom indices as uint64,
  # and returns `MetaValue` wrappers from `frame.meta` (write by wholesale
  # assignment). molhub tracks that minor line.
  "molcrafts-molpy>=0.14,<0.15",
  # Process home singleton (`molhub.config`) is a molcfg.Config subclass.
  "molcrafts-molcfg>=1.5.0",
  # Imported at module scope by every dataset adapter and by the conveyor's
  # encoder; it used to resolve only through h5py's transitive pull, which is a
  # dependency defect rather than a declaration.
  "numpy>=1.26",
  "tqdm",
  "requests>=2.28",
  "h5py>=3.11",
  "pyyaml>=6.0",
  "typer>=0.12",
  "lmdb>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  # Proves the shipped JSON Schema is valid and enforces what it claims;
  # the runtime parser does not depend on it.
  "jsonschema>=4.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.15",
  "ruff>=0.15",
  # ty reads types out of packages that ship no
  # py.typed (molpy does not), which is the only way a checker can see the
  # `Frame.metadata` -> `Frame.meta` class of upstream rename; mypy treats
  # molpy as Any and sees nothing. Gate it (tox lint / ci.yml / pre-commit)
  # CI gates `ty check src/`; keep a lower bound because ty is still 0.0.x and
  # diagnostics can move between releases.
  "ty>=0.0.69",
  "tox>=4.23",
]
huggingface = ["huggingface_hub>=0.20"]
omol = ["lmdb>=1.4"]
# The conveyor's prepare stage writes molnex `molix.block/1` blocks through
# `molhub.conveyor.prepare.MolnexBlockWriter`. molnex is **not published on
# PyPI**, so this extra can only name the publishable half — torch. For the
# other half, install molnex from a source checkout, or point `MOLNEX_SRC` at
# its `src/` directory (the escape hatch `tests/test_dataset/test_neighbor.py`
# already uses). Everything except `MolnexBlockWriter` works without either:
# the `molix` import is lazy, inside that class.
prepare = ["torch>=2.10"]

[dependency-groups]
docs = [
  "zensical>=0.0.45",
  "molcrafts-zensical-theme>=0.2.9,<0.3",
  "mkdocstrings-python>=1.16",
]

[project.scripts]
molhub = "molhub.cli:app"

[project.urls]
Repository = "https://github.com/MolCrafts/molhub"

# Third-party packages add a hosting platform by publishing a Source driver
# into this group; molhub discovers it with no source change on our side.
[project.entry-points."molhub.sources"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molhub = ["schema/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*"]
# Network tests are opt-in: CI must not go red because an upstream data
# repository is slow. Run them with `pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "real_home_default: the subject is config.home_dir's real default; skips home isolation","network: touches a real upstream source"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E402",
  "E741",
  "F403",
  "F405",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ty.environment]
python-version = "3.12"

# `huggingface_hub` lives in the optional `huggingface` extra and is imported
# function-locally so molhub works without it. The lint environment
# deliberately does not install it, so its import is unresolvable there. This
# silences the missing third-party module only — every other rule still
# applies to this file.
[[tool.ty.overrides]]
include = ["src/molhub/sources/drivers/huggingface.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Same treatment for `molix` (molnex): only the neighbour delegate wants it, it
# is imported inside the method that needs it, and it is not on PyPI, so no
# extra can pull it and the lint environment never resolves it.
[[tool.ty.overrides]]
include = ["src/molhub/dataset/neighbor.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# And for the loader's molix delegate: `DataModule.__init__` imports
# `molix.data` and, on the packing path, `torch` inside the method that needs
# them. Neither is on PyPI so no extra can pull molnex, and the lint environment
# installs neither — the same situation as the three sites above, and the reason
# this file reported the last two `unresolved-import` diagnostics once the real
# type errors were fixed.
[[tool.ty.overrides]]
include = ["src/molhub/loader/datamodule.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# And once more for the conveyor's single lazy import site: `MolnexBlockWriter`
# imports `torch` and `molix.store.block` inside its constructor (the Option-A
# ruling), the `prepare` extra cannot pull molnex because it is unpublished, and
# the lint environment installs neither.
[[tool.ty.overrides]]
include = ["src/molhub/conveyor/prepare.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# And for the espaloma converter: `dgl` is why that conversion is offline and
# once — molhub does not depend on it, no extra pulls it, and it is imported
# inside the one method that needs it so `--help` answers without it. The lint
# environment can never resolve it, by design.
[[tool.ty.overrides]]
include = ["src/molhub/scripts/convert_espaloma_phalkethoh_mm.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Local editable checkouts, by operator ruling (2026-09-18): nothing is pushed,
# development happens against the sibling working trees.
#
# The git revs this replaced could not work. `rev = "dev"` resolved molpy to
# 4929187, which predates `molpy.io.mrec` — the module `dataset/molrec.py`
# imports — and molrs to cfb3c03, which has no `molrs.io.mrec` at all and still
# exports the `HollowSphere` that molrs later removed. Both surfaces live only in
# unpushed commits, so a published pin cannot see them and the `ty` gate failed on
# an import that genuinely does not resolve.
#
# The published pins in [project] dependencies are unchanged, so packaging still
# states what a release would need. These two lines are the development override;
# they make the lock machine-specific, which is the accepted cost of not pushing.
[tool.uv.sources]
molcrafts-molpy = { path = "../molpy", editable = true }
molcrafts-molrs = { path = "../molrs/molrs-python", editable = true }

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff>=0.15",
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
commands = [
  ["ruff", "check", "src/", "tests/"],
  ["ruff", "format", "--check", "src/", "tests/"],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "--cov=src/molhub", "--cov-report=term-missing", "--cov-report=xml", "-v"],
]
