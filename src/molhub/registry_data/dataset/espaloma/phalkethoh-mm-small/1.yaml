# Espaloma PhAlkEthOH MM-small (Validation B / MM energy reproduction).
#
# Upstream ships DGL heterographs (Espaloma GraphDataset layout). MolHub consumers
# use the normalized Frame tree produced by
# ``scripts/convert_espaloma_phalkethoh_mm.py`` (requires dgl once at convert time).
# Adapter :class:`~molhub.dataset.PhalkethohMMDataset` reads the normalized tree
# (splits.json + mols/<id>/{atoms,confs}.npz); unit tests use synthetic fixtures.
schema_version: 1
kind: dataset
namespace: espaloma
name: phalkethoh-mm-small
version: "1"

title: PhAlkEthOH MM-small multi-conformer MM energies (Espaloma toy)
description: >-
  Espaloma subsampled PhAlkEthOH MM-fitting set: 173 C/H/O molecules with 100
  conformers each (17 300 frames). Reference MM energies stored as graph-level
  u_ref in Hartree in the native DGL payload; after conversion they are
  mm_energy in kcal/mol (×627.5094740631). Coordinates in Å. Molecule-level
  80:10:10 split with Espaloma notebook seed 2666 (espaloma-original).
  Official bytes: choderalab/espaloma release 0.2.1 asset small_phalkethoh_mm.zip.
  Convert once: python scripts/convert_espaloma_phalkethoh_mm.py --src <zip> --out <dir>.
license: MIT
doi: 10.1039/D2SC02739A

artifacts:
  - role: main
    filename: small_phalkethoh_mm.zip
    digest: sha256:61371668970c9f7a55911bb82f5b0f1a5fbecb4b64aa080b402733eee3429a9a
    size: 280619984
    locators:
      - https://github.com/choderalab/espaloma/releases/download/0.2.1/small_phalkethoh_mm.zip

targets:
  graph_level:
    - mm_energy
  atom_level:
    - forces
