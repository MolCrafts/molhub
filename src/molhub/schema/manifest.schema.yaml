# JSON Schema for a molhub artifact manifest, written in YAML.
#
# JSON Schema is a data model, not a serialisation syntax, so writing it in YAML
# costs nothing and buys comments. Any conforming validator reads this after a
# YAML load -- it is the contract for the index CI and for non-Python clients,
# and it is deliberately not what the Python runtime parses with.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://molcrafts.org/schema/molhub/manifest/1"
title: molhub artifact manifest
type: object
additionalProperties: false

required: [schema_version, kind, namespace, name, version, title, artifacts]

properties:
  schema_version:
    const: 1

  kind:
    enum: [dataset, model, plugin]

  namespace:
    $ref: "#/$defs/segment"

  name:
    $ref: "#/$defs/segment"

  version:
    description: >-
      Required. A coordinate without a version cannot name an immutable
      artifact, so molhub rejects one rather than guessing "latest".
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"

  title:
    type: string
    minLength: 1

  description:
    type: string

  license:
    description: SPDX identifier, e.g. CC0-1.0.
    type: string

  citation:
    description: DOI or free-form citation.
    type: string

  artifacts:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/artifact" }

  targets:
    description: >-
      Declarative only. Nothing in the transport or resolution layers parses
      bytes according to this; it is for display and for downstream consumers.
    type: object
    additionalProperties: false
    properties:
      graph_level: { type: array, items: { type: string } }
      atom_level: { type: array, items: { type: string } }

$defs:
  segment:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"

  artifact:
    type: object
    additionalProperties: false
    required: [role, filename, locators]
    properties:
      role:
        description: How consumers refer to this file -- main, exclude, weights...
        type: string
        minLength: 1

      filename:
        type: string
        minLength: 1

      digest:
        description: >-
          Whatever the platform publishes for this file, copied verbatim --
          Figshare and Zenodo publish md5, HuggingFace a sha256 LFS OID. Omit
          it when the platform publishes nothing; molhub never invents one.
          Its job is to confirm upstream still serves the version this manifest
          names. When it stops matching, upstream changed and the manifest
          needs a new version.
        type: string
        pattern: "^(md5|sha1|sha256|sha512):[0-9a-f]+$"

      size:
        type: integer
        minimum: 0

      locators:
        description: Ordered candidate sources; earlier entries are preferred.
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^[a-z][a-z0-9+.-]*://.+$"
