name: setup-partners
description: >
  Check out a partner repository at its integration ref. A change spanning
  both repositories is built against the partner's branch of the same name
  (the fork's first, then the upstream's) when one exists.
inputs:
  repository:
    description: Upstream partner, owner/name
    required: true
  ref:
    description: Partner branch or tag used when it has no same-named branch
    default: dev
  path:
    description: Checkout directory, relative to the workspace
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPO: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.path }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        FORK: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
      run: |
        set -euo pipefail
        src="$REPO" ref="$REF"
        if [ "$BRANCH" != "$REF" ]; then
          for cand in "$FORK/${REPO#*/}" "$REPO"; do
            if git ls-remote --exit-code --heads "https://github.com/$cand.git" "refs/heads/$BRANCH" >/dev/null 2>&1; then
              src="$cand" ref="$BRANCH"
              break
            fi
          done
        fi
        echo "partner $REPO -> $src@$ref ($DEST)"
        git init -q "$DEST"
        git -C "$DEST" fetch -q --depth=1 "https://github.com/$src.git" "$ref"
        git -C "$DEST" checkout -q --detach FETCH_HEAD
