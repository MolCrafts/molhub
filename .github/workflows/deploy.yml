name: deploy

# Upstream only: a push to master deploys the submission API Worker (D1
# migrations first), then smokes /health. Skipped until MOLHUB_API_URL is set
# and wrangler.jsonc names a provisioned D1 database.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      write_smoke:
        description: "Create one persistent staging smoke submission"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  api:
    name: deploy / api
    if: github.repository_owner == 'MolCrafts' && vars.MOLHUB_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: ${{ vars.MOLHUB_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Require a provisioned D1 database id
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' apps/api/wrangler.jsonc; then
            echo "::error::Provision D1 and replace the placeholder database_id before deployment."
            exit 1
          fi
      - run: npm run deploy:dry --workspace @molcrafts/molhub-api
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply molhub-submissions --remote
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          workingDirectory: apps/api
          command: deploy
      - run: curl --fail-with-body --retry 4 --retry-all-errors "$API_URL/health" | grep '"status":"ok"'
      - name: Smoke create and status in the configured staging API
        if: inputs.write_smoke
        run: |
          NAME="deployment-smoke-${GITHUB_RUN_ID}"
          RESPONSE=$(curl --fail-with-body --request POST "$API_URL/v1/submissions" \
            --header 'content-type: application/json' \
            --data "{\"manifest\":{\"schema_version\":1,\"kind\":\"dataset\",\"namespace\":\"smoke\",\"name\":\"$NAME\",\"version\":\"v1\",\"title\":\"Deployment smoke\",\"license\":\"CC0-1.0\",\"doi\":\"10.0000/smoke\",\"artifacts\":[{\"role\":\"main\",\"filename\":\"sample.xyz\",\"format\":\"extxyz\",\"media_type\":\"chemical/x-xyz\",\"size\":4,\"locators\":[\"https://example.test/sample.xyz\"]}]}}")
          ID=$(printf '%s' "$RESPONSE" | jq -r .id)
          test -n "$ID" && test "$ID" != null
          curl --fail-with-body "$API_URL/v1/submissions/$ID" | grep '"status":"pending"'
