name: Web

on:
  pull_request:
    branches: [main, master, dev]
    paths:
      - "apps/web/**"
      - "packages/typescript/**"
      - "packages/registry-tools/**"
      - "spec/**"
      - "package.json"
      - "package-lock.json"
      - ".github/assets/moko.svg"
      - ".github/workflows/web.yml"
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/typescript/**"
      - "packages/registry-tools/**"
      - "spec/**"
      - "package.json"
      - "package-lock.json"
      - ".github/assets/moko.svg"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, typecheck, prerender
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out MolHub
        uses: actions/checkout@v4

      - name: Check out the canonical registry database
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molhub-registry
          path: .registry-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace
        run: npm ci

      - name: Validate and build the registry snapshot input
        run: |
          npm run registry:validate -- "$GITHUB_WORKSPACE/.registry-source/artifacts"
          npm run registry:build -- "$GITHUB_WORKSPACE/.registry-source/artifacts" "$GITHUB_WORKSPACE/.registry-source/dist"

      - name: Record the registry source revision
        run: echo "PUBLIC_MOLHUB_REGISTRY_REVISION=$(git -C .registry-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Web gates
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.registry-source/dist/registry.json
        run: |
          npm run lint --workspace @molcrafts/molhub-web
          npm run test --workspace @molcrafts/molhub-web
          npm run typecheck --workspace @molcrafts/molhub-web
          npm run build --workspace @molcrafts/molhub-web

      - name: Check the prerendered site exists
        run: test -s apps/web/dist/client/index.html

      - name: Install the Inspector browser
        run: npx playwright install --with-deps chromium

      - name: Run the real-browser Inspector acceptance
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.registry-source/dist/registry.json
        run: npm run test:e2e --workspace @molcrafts/molhub-web

      - name: Retain Inspector screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-browser-${{ github.sha }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
