name: docs

# docs / build (strict Zensical + TypeDoc, every Python and TypeScript snippet
# executed) runs in every context. Upstream only, on master: docs / deploy
# publishes it, and docs / web publishes MolHub Web; molhub-registry's deploy
# also asks for docs / web after it publishes a new snapshot. Each deploy is
# skipped until its Cloudflare project variable exists.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  repository_dispatch:
    types: [registry-published]

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

# molhub is built against its partners (.github/partners.env) at the commits
# scripts/partners.py resolves -- molpy's and molrs's dev, or their branches
# named like this one -- checked out as siblings, the layout the
# [tool.uv.sources] path dependencies expect, as in lint.yml.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: docs / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      cancel: ${{ steps.context.outputs.cancel }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  build:
    name: docs / build
    needs: context
    # A pull request inside a fork was already run by its push.
    if: github.event_name != 'repository_dispatch' && needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: uv sync --extra dev
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: npm run docs:check
      - uses: actions/upload-artifact@v7
        with:
          name: molhub-docs-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: docs / deploy
    needs: [context, build]
    if: needs.context.outputs.upstream == 'true' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/master","refs/heads/main"]'), github.ref) && vars.CLOUDFLARE_DOCS_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-docs-${{ github.sha }}
          path: site
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_DOCS_PROJECT }} --branch=${{ github.ref_name }}

  web:
    name: docs / web
    needs: context
    if: needs.context.outputs.upstream == 'true' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/master","refs/heads/main"]'), github.ref) && vars.CLOUDFLARE_PAGES_PROJECT != '' && vars.MOLHUB_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    env:
      PUBLIC_MOLHUB_API_URL: ${{ vars.MOLHUB_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: ./.github/actions/setup-registry
      - run: npm run test --workspace @molcrafts/molhub-web
      - run: npm run typecheck --workspace @molcrafts/molhub-web
      - run: npm run build --workspace @molcrafts/molhub-web
      - run: test -s apps/web/dist/client/index.html
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: pages deploy apps/web/dist/client --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
