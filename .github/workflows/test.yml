name: test

# Two tiers (`test / tier` decides); see "CI and release" in
# docs/operations/deployment.md.
#
#   fast  a feature-branch push to MolCrafts: test / python on Linux, Python
#         3.12, and test / node.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         + Python 3.13/3.14, macOS, Windows, test / browser, test / package.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tier:
    name: test / tier
    # A pull request inside a fork was already run, full tier, by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ github.repository_owner != 'MolCrafts' || contains(fromJSON('["dev","master","main"]'), github.ref_name) || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}" | tee -a "$GITHUB_OUTPUT"

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: tier
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tier.outputs.full == 'true' && '[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.12"},{"os":"windows-latest","python":"3.12"}]' || '[{"os":"ubuntu-latest","python":"3.12"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run pytest -q

  # Every workspace's tests, the cross-SDK CLI and cache parity, and the
  # publishable outputs (SDK, Worker dry run, prerendered Web).
  node:
    name: test / node
    needs: tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv sync --extra dev
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: ./.github/actions/setup-registry
      - run: npm run build --workspace @molcrafts/molhub
      - run: npm run test --workspaces --if-present
      - run: npm run cli:parity
      - run: npm run cache:parity
      - run: npm run deploy:dry --workspace @molcrafts/molhub-api
      - run: npm run build --workspace @molcrafts/molhub-web
      - run: test -s apps/web/dist/client/index.html

  # The Inspector in a real Chromium against the prerendered site.
  browser:
    name: test / browser
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: ./.github/actions/setup-registry
      - run: npm run build --workspace @molcrafts/molhub-web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @molcrafts/molhub-web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: inspector-browser-${{ github.sha }}
          path: apps/web/test-results/
          retention-days: 14

  # What the wheel and the npm tarball ship.
  package:
    name: test / package
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: npm run package:audit
