name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=src/molhub --cov-report=term-missing --cov-report=json:coverage.json --junitxml=junit.xml -v
      - name: Report tests and coverage
        if: ${{ !cancelled() }}
        uses: MolCrafts/molcrafts-ci/actions/report@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          title: test (Python ${{ matrix.python-version }})
          junit: junit.xml
          coverage: coverage.json
