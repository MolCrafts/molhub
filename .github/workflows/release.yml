name: release

# A `v*` tag on MolCrafts runs every gate, builds the Python distribution and
# the @molcrafts/molhub tarball, and publishes both (PyPI and npm trusted
# publishing). workflow_dispatch is a dry run anywhere: the same gates and
# artifacts, nothing uploaded. Write the GitHub Release notes from
# .github/RELEASE_TEMPLATE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release / build
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv sync --extra dev
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-registry
      - run: npm run security:audit
      - run: npm run check
      - run: uv run pytest -q
      - run: npm run docs:check
      - run: npm run package:audit
      - run: |
          mkdir -p dist/python dist/npm
          uv build --out-dir dist/python
          npm pack --workspace @molcrafts/molhub --pack-destination dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  publish:
    name: release / publish
    needs: build
    if: github.event_name == 'push' && github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
      # npm >= 11.5 (Node 24) publishes through the OIDC id-token when
      # NPM_TOKEN is unset.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish dist/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
