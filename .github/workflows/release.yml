name: release

# A `v*` tag on MolCrafts: guard -> lint + the full test tier -> build (docs
# check, package audit, the Python distribution and the @molcrafts/molhub
# tarball) -> PyPI and npm (trusted publishing). A dispatch is the dry run,
# on any branch, fork or upstream: the same gates and artifacts, nothing
# uploaded. Write the GitHub Release notes from .github/RELEASE_TEMPLATE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: release / guard
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }

  lint:
    needs: guard
    uses: ./.github/workflows/lint.yml

  test:
    needs: guard
    uses: ./.github/workflows/test.yml

  build:
    name: release / build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv sync --extra dev
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: ./.github/actions/setup-registry
      - run: npm run docs:check
      - run: npm run package:audit
      - run: |
          mkdir -p dist/python dist/npm
          uv build --out-dir dist/python
          npm pack --workspace @molcrafts/molhub --pack-destination dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  pypi:
    name: release / pypi
    needs: build
    if: github.event_name == 'push' && github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
          skip-existing: true

  # npm >= 11.5 (Node 24) publishes through the OIDC id-token when NPM_TOKEN
  # is unset.
  npm:
    name: release / npm
    needs: build
    if: github.event_name == 'push' && github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          install: "false"
      - run: npm publish dist/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
