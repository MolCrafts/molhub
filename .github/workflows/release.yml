name: release

# A `v*` tag on MolCrafts: guard -> lint + the full test tier -> build (docs
# check, package audit, the Python distribution and the @molcrafts/molhub
# tarball) -> PyPI and npm (trusted publishing: release.yml and the `pypi` /
# `npm` environments). A dispatch is the dry run, on any branch, fork or
# upstream: the same gates and artifacts, nothing uploaded, no environment. Write the GitHub Release notes from .github/RELEASE_TEMPLATE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# molhub is built against its partners (.github/partners.env) at the commits
# scripts/partners.py resolves -- molpy's and molrs's dev, or their branches
# named like this one -- checked out as siblings, the layout the
# [tool.uv.sources] path dependencies expect, as in lint.yml.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      cancel: ${{ steps.context.outputs.cancel }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  guard:
    name: release / guard
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }

  lint:
    needs: guard
    uses: ./.github/workflows/lint.yml

  test:
    needs: guard
    uses: ./.github/workflows/test.yml

  build:
    name: release / build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: uv sync --extra dev
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: ./.github/actions/setup-registry
      - run: npm run docs:check
      - run: npm run package:audit
      - run: |
          mkdir -p dist/python dist/npm
          uv build --out-dir dist/python
          npm pack --workspace @molcrafts/molhub --pack-destination dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  pypi:
    name: release / pypi
    needs: [context, build]
    if: github.event_name == 'push' && needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
          skip-existing: true

  # npm >= 11.5 (Node 24) publishes through the OIDC id-token when
  # NODE_AUTH_TOKEN is empty (setup-node's registry-url exports a placeholder).
  npm:
    name: release / npm
    needs: [context, build]
    if: github.event_name == 'push' && needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: molhub-release-${{ github.sha }}
          path: dist/
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          install: "false"
      - run: npm publish dist/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""
