name: nightly

# Upstream only, weekly: coverage to Codecov. molhub tracks its partners' dev
# on every push (.github/partners.env), so no job tests a newer molpy here.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a nightly run is never cancelled.
# The canonical block: actions/check-workflows.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: nightly / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  coverage:
    name: nightly / coverage
    needs: context
    if: needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: uv sync --extra dev
      - run: uv run pytest -q --cov=src/molhub --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
