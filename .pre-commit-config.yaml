# Managed by prek: `prek install`
# CI parity: same shell commands as .github/workflows/lint.yml and test.yml (no tox wrapper).
# tox remains in [project.optional-dependencies] dev for optional local isolation.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^packages/registry-tools/test/fixtures/malformed-yaml/
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^vendor/molcrafts-molvis-stage-0\.2\.0\.tgz$
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as lint.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src/ tests/ scripts/ && uv run ruff format --check src/ tests/ scripts/ && uv run ty check src/ && npm run check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (same as test.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest --cov=src/molhub --cov-report=xml -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
